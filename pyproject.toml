[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "audio-assist"
version = "0.1.0"
description = "Local always-listening audio assistant microservice."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0,<1.0.0",
  "uvicorn[standard]>=0.30.0,<1.0.0",
  "pydantic>=2.8.0,<3.0.0",
  "pydantic-settings>=2.3.0,<3.0.0",
  "numpy>=1.26.0,<3.0.0",
  "faster-whisper>=1.0.3,<2.0.0",
  "httpx>=0.27.0,<1.0.0",
  "sounddevice>=0.4.7,<1.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0,<9.0.0",
  "ruff>=0.5.0,<1.0.0",
]
tts = [
  "qwen-tts>=0.1.0",
]

[project.scripts]
audio-assist = "audio_assist.main:main"
tts-service = "tts_service.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
audio_assist = ["static/*.html", "static/*.css", "static/*.js"]

[tool.ruff]
line-length = 100
target-version = "py311"
